<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'"
    />
    <title>ASIP Beacon</title>
    <link rel="stylesheet" href="window.css" />
    <script defer src="window.js"></script>
  </head>
  <body>
    <header>
      <img src="icon.png" alt="" />
      <h1>ASIP</h1>
    </header>
    <main>
      <section id="signed-out">
        <h2>Sign in</h2>
        <div class="buttons">
          <button id="google">Google</button><button id="github">GitHub</button>
        </div>
        <p id="preview" hidden>
          Sign-in is not configured in this preview build.
        </p>
      </section>
      <section id="account" hidden>
        <div class="account-row">
          <div>
            <strong id="account-name"></strong>
            <p id="account-handle"></p>
          </div>
          <button id="signout">Sign out</button>
        </div>
        <h2 id="connection-state">No plugins connected</h2>
        <div id="clients"></div>
        <p id="record-count"></p>
      </section>
      <section id="request" hidden>
        <h2 id="request-title"></h2>
        <p id="request-account"></p>
        <div class="buttons">
          <button id="connect">Connect</button
          ><button id="cancel">Cancel</button>
        </div>
      </section>
      <section id="device" hidden>
        <p>Enter this code on GitHub:</p>
        <code id="device-code"></code>
      </section>
      <section id="plugins">
        <h2>Install a plugin</h2>
        <select id="agent" aria-label="Agent">
          <option value="codex">Codex</option>
          <option value="claude-code">Claude Code</option>
          <option value="antigravity">Antigravity</option>
        </select>
        <button id="export">Save plugin</button>
        <pre id="install-command"></pre>
      </section>
      <section id="connections" hidden>
        <h2>API connections</h2>
        <div id="connection-list"></div>
        <details id="connection-details">
          <summary>Add connection</summary>
          <form id="connection-form">
            <label
              >Name<input
                id="connection-name"
                placeholder="openai.work"
                required
                pattern="[a-z][a-z0-9._-]{1,79}"
                autocomplete="off"
            /></label>
            <label
              >Provider<select id="connection-provider">
                <option value="openai">OpenAI</option>
                <option value="anthropic">Anthropic</option>
                <option value="gemini">Google Gemini</option>
                <option value="github">GitHub</option>
                <option value="custom">Other API</option>
              </select></label
            >
            <div id="connection-custom" hidden>
              <label
                >API origin<input
                  id="connection-origin"
                  placeholder="https://api.example.com"
                  type="url"
              /></label>
              <label
                >Authentication header<input
                  id="connection-header"
                  value="Authorization"
              /></label>
            </div>
            <label id="connection-credential-label"
              >API key or token<input
                id="connection-credential"
                type="password"
                required
                autocomplete="off"
            /></label>
            <div id="connection-github" hidden>
              <label
                >Repository access<select id="connection-github-scope">
                  <option value="public_repo">Public repositories</option>
                  <option value="repo">Public and private repositories</option>
                </select></label
              >
              <button id="connection-github-signin" type="button">
                Connect GitHub
              </button>
              <button id="connection-github-token" type="button">
                Use a token
              </button>
            </div>
            <label
              ><input id="connection-all-projects" type="checkbox" checked />
              All projects</label
            >
            <label id="connection-project-label" hidden
              >Projects<select id="connection-projects" multiple></select
            ></label>
            <button id="connection-save" type="submit">Save connection</button>
          </form>
        </details>
      </section>
      <p id="error" role="alert"></p>
      <footer id="progress"></footer>
      <button id="signin-cancel" hidden>Cancel sign-in</button>
    </main>
  </body>
</html>
