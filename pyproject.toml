[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asip-agent-memory"
dynamic = ["version"]
description = "Persistent project memory, intent, audit and named API access for AI agents"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
admin = ["mcp==2.0.0"]
credentials = ["keyring>=25,<26"]
beacon = ["pystray>=0.19,<0.20", "Pillow>=11,<13", "keyring>=25,<26"]

[project.scripts]
asip-mcp-inspect = "asip_mcp:inspect_main"
asip-mcp-admin = "asip_mcp:admin_main"
asip-memory = "memory.cli:main"
asip-beacon = "memory.cli:beacon_main"

[tool.setuptools]
packages = ["core", "memory", "integrations"]
py-modules = ["asip_mcp"]

[tool.setuptools.package-data]
memory = ["assets/*.html", "assets/*.css", "assets/*.js"]
integrations = ["skill.md", "**/*.json", "**/*.md", "**/*.js"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
