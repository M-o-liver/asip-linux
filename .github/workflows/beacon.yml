name: Beacon and plugins
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asip-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci
      - run: npm test
      - run: go test -race ./...
        working-directory: plugin-helper
      - run: npm install --global @openai/codex@0.162.1 @anthropic-ai/claude-code@2.1.299
      - run: node scripts/qualify-plugins.mjs
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: asip-${{ matrix.os }}
          path: |
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            build/qualification.json
          if-no-files-found: error
