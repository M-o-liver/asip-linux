name: Beacon and plugins
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asip-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - run: npm ci
      - run: npm test
      - run: go test -race ./...
        working-directory: plugin-helper
      - run: npm install --global @openai/codex@0.162.1 @anthropic-ai/claude-code@2.1.299
      - run: node scripts/qualify-plugins.mjs
      - run: sudo apt-get update && sudo apt-get install -y rpm
        if: runner.os == 'Linux'
      - run: node scripts/configure-signin.mjs
        env:
          ASIP_GOOGLE_DESKTOP_CLIENT_JSON: ${{ secrets.ASIP_GOOGLE_DESKTOP_CLIENT_JSON }}
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: sudo apt-get install -y ./artifacts/*.deb
        if: runner.os == 'Linux'
      - run: xvfb-run -a node scripts/smoke-beacon.mjs --installed
        if: runner.os == 'Linux'
      - run: node scripts/smoke-beacon.mjs
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: asip-${{ matrix.os }}
          path: |
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            build/qualification.json
          if-no-files-found: error
